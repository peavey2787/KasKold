[package]
name = "rqrr"
edition = "2021"
version = "0.10.1-nostd"
description = "QR code detection and decoding - no_std fork for KasKold"
license = "(MIT OR Apache-2.0) AND ISC"

[dependencies]
# No external dependencies — GF arithmetic is inline

[features]
default = []

[workspace]
resolver = "2"

[lints.clippy]
cast_possible_truncation = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
undocumented_unsafe_blocks = "deny"
