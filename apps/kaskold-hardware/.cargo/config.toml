[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

# The CoreS3 carries quad-SPI PSRAM: in octal mode esp-hal maps no PSRAM and the
# firmware halts at boot. `force` keeps every build (QA gates, HIL, flash,
# release) on the configuration that ships, whatever the caller's environment.
[env]
ESP_HAL_CONFIG_PSRAM_MODE = { value = "quad", force = true }

[unstable]
build-std = ["core", "alloc"]
