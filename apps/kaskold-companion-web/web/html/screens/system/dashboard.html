            <!-- Dashboard (balance + actions) -->
            <section id="screen-dashboard" class="screen">
                <div class="screen-content">
                    <div class="balance-card">
                        <button class="balance-refresh-button" id="btn-refresh" type="button" aria-label="Refresh balance" title="Refresh balance">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/>
                            </svg>
                        </button>
                        <div class="balance-label">Balance</div>
                        <div class="balance-value-row">
                            <div class="balance-amount" id="balance-kas" data-balance-sompi="">—</div>
                            <button class="balance-unit-toggle" id="btn-balance-unit-toggle" type="button" aria-label="Show balance in Sompi" title="Show balance in Sompi">KAS</button>
                        </div>
                        <div class="balance-info" id="balance-info"></div>
                        <div class="balance-info" id="balance-daa"></div>
                        <nav class="dashboard-secondary-links" aria-label="Wallet views">
                            <button class="dashboard-secondary-link" id="btn-dashboard-tokens" type="button">Tokens</button>
                            <button class="dashboard-secondary-link" id="btn-dashboard-history" type="button">History</button>
                            <button class="dashboard-secondary-link" id="btn-dashboard-portfolio" type="button">Portfolio</button>
                        </nav>
                    </div>

                    <div class="dashboard-action-grid" aria-label="Wallet actions">
                        <button class="btn dashboard-action-tile" id="btn-send">
                            <svg class="dashboard-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M7 17 17 7M9 7h8v8"/>
                            </svg>
                            <span>Send KAS</span>
                        </button>
                        <button class="btn dashboard-action-tile" id="btn-receive">
                            <svg class="dashboard-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M17 7 7 17M15 17H7V9"/>
                            </svg>
                            <span>Receive</span>
                        </button>
                        <button class="btn dashboard-action-tile" id="btn-multisig-spend">
                            <svg class="dashboard-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <circle cx="7" cy="8" r="2.5"/>
                                <circle cx="17" cy="8" r="2.5"/>
                                <circle cx="12" cy="17" r="2.5"/>
                                <path d="m8.8 9.8 2.1 4.3m4.3-4.3-2.1 4.3M9.5 8h5"/>
                            </svg>
                            <span>Multisig</span>
                        </button>
                        <button class="btn dashboard-action-tile" id="btn-advanced">
                            <svg class="dashboard-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/>
                            </svg>
                            <span>Advanced</span>
                        </button>
                    </div>

                    <button class="btn btn-link btn-danger" id="btn-reset-wallet">
                        Unload wallet
                    </button>
                </div>
            </section>
