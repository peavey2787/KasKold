[package]
name = "kaskold-vault-web"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
description = "Network-free KasKold Vault Web WASM signer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.120"
vault-runtime = { version = "=2.0.0", path = "../../crates/vault-runtime" }
shared-signer = { version = "=2.0.0", path = "../../crates/shared-signer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
qrcode = { version = "0.14.1", default-features = false }

[workspace]
resolver = "2"

[profile.dev]
opt-level = "s"
overflow-checks = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
overflow-checks = true
