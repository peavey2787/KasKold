[package]
name = "hot-wallet"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "KasKold software-wallet custody and signing backend"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
offline-signer = { version = "=2.0.0", path = "../offline-signer" }
kaskold-protocol = { version = "=2.0.0", path = "../kaskold-protocol", features = ["host"] }
shared-signer = { version = "=2.0.0", path = "../shared-signer" }
sha2 = { version = "0.10.9", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
