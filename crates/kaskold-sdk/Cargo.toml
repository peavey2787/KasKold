[package]
name = "kaskold-sdk"
version = "2.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Friendly network-free Rust/WASM SDK for integrating KasKold hardware into wallets"
repository = "https://github.com/peavey2787/KasKold"
keywords = ["kaspa", "wallet", "hardware-wallet", "wasm", "sdk"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["rlib"]

[features]
default = ["native"]
native = []
wasm = ["kaskold-protocol/wasm"]

[dependencies]
kaskold-protocol = { version = "=2.0.0", path = "../kaskold-protocol" }
serde = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1"
# Compatible range (see kaskold-protocol); KasKold's lockfiles resolve 0.2.120.
wasm-bindgen = "0.2.108"
js-sys = "0.3.85"

[dev-dependencies]
serde_json = "1"
shared-signer = { version = "=2.0.0", path = "../shared-signer" }
