[package]
name = "kaskold-protocol"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Low-level network-free KasKold pairing, PSKT/KSPT, QR, and response-validation protocol"
repository = "https://github.com/peavey2787/KasKold"
keywords = ["kaspa", "hardware-wallet", "wasm", "protocol", "pskt"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["rlib"]

[features]
default = ["host"]
host = [
    "dep:serde",
    "dep:serde_json",
    "dep:hex",
    "dep:k256",
    "dep:hmac",
    "dep:sha2",
    "dep:blake2b_simd",
]
wasm = ["host", "dep:wasm-bindgen", "dep:js-sys"]
companion-compat = ["host"]

[dependencies]
kaspa-portal = { git = "https://github.com/peavey2787/kaspa-portal.git", rev = "de51c1fba31c60ebc2e87341854110097bccf41a", default-features = false }
shared-signer = { version = "=2.0.0", path = "../shared-signer" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "schnorr"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
blake2b_simd = { version = "1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Libraries declare a compatible range so hosts (Ghost Talk, Kinesis) can unify
# with their own wasm-bindgen family; KasKold's lockfiles still resolve 0.2.120.
wasm-bindgen = { version = "0.2.108", optional = true }
js-sys = { version = "0.3.85", optional = true }
