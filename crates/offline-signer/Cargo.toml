[package]
name = "offline-signer"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Offline-only KasKold wallet, review, and signing core"

[features]
default = []
skip-tests = []
verbose-boot = []

[dependencies]
kaspa-portal = { git = "https://github.com/peavey2787/kaspa-portal.git", rev = "00b71cbbb0381afba4b5b3d40b93fe1c43e8e1f7", default-features = false, features = ["self-test"] }
shared-signer = { path = "../shared-signer" }
kaskold-protocol = { version = "=2.0.0", path = "../kaskold-protocol", default-features = false }
sha2 = { version = "0.10", default-features = false }
ripemd = { version = "0.1.3", default-features = false }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdsa", "schnorr"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
blake2 = { version = "0.10.6", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["derive"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
