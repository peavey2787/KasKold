[package]
name = "kaskold-qa"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Repository-wide conformance, integration, and regression checks"

[dev-dependencies]
firmware-tools = { path = "../tools" }
kaspa-portal = { git = "https://github.com/peavey2787/kaspa-portal.git", rev = "2c88c99e352318707de9bf5edf2a96beade96006", default-features = false }
offline-signer = { path = "../crates/offline-signer" }
kaskold-protocol = { path = "../crates/kaskold-protocol" }
kaskold-sdk = { path = "../crates/kaskold-sdk" }
shared-signer = { path = "../crates/shared-signer" }
kaskold-hardware-core = { path = "../crates/kaskold-hardware-core" }
serde_json = "1"
hex = "0.4"

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "tooling_firmware_signing"
path = "tests/integration/firmware_signing.rs"

[[bench]]
name = "protocol_throughput"
path = "benches/protocol_throughput.rs"
harness = false

[workspace]
resolver = "2"
