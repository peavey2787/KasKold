[package]
name = "kaskold-fuzz"
version = "2.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
hex = "0.4"
serde_json = "1"
shared-signer = { path = "../../crates/shared-signer" }
kaskold-hardware-core = { path = "../../crates/kaskold-hardware-core" }
kaskold-protocol = { path = "../../crates/kaskold-protocol", features = ["host", "companion-compat"] }
offline-signer = { path = "../../crates/offline-signer" }

[[bin]]
name = "unwrap_qr_payload"
path = "unwrap_qr_payload.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "2"

